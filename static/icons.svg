    <!-- Olive Drop (brand icon, replaces 🫒) -->
    <symbol id="olive-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2C12 2 5 10 5 16C5 19.866 8.134 23 12 23C15.866 23 19 19.866 19 16C19 10 12 2 12 2Z"/>
      <circle cx="10.5" cy="15.5" r="1.5" fill="currentColor" stroke="none" opacity="0.3"/>
    </symbol>

    <!-- Shop (UMKM, replaces 🏪) -->
    <symbol id="shop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9L5 4H19L21 9"/>
      <rect x="3" y="9" width="18" height="12" rx="1"/>
      <path d="M7 13V9M17 13V9M7 17H17"/>
      <path d="M9 21V17H15V21"/>
    </symbol>

    <!-- Building (Perusahaan, replaces 🏭) -->
    <symbol id="building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
